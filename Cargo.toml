[workspace]
members = [
    "crates/huerarchy-core",
    "crates/huerarchy-server",
]
exclude = ["research/inference-lab"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["kmosoti"]
license = "Apache-2.0"
repository = "https://github.com/kmosoti/huerarchy"

[workspace.dependencies]
huerarchy-core = { path = "crates/huerarchy-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
schemars = { version = "1.0", features = ["derive", "chrono04"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive", "env"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "client"] }
tempfile = "3.13"
